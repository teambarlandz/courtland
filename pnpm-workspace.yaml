packages:
  - apps/*
  - packages/*

# The version catalog (docs/02 § 9.1 lists the full target set). Entries are
# added in the phase that first references them — knip fails on an unused
# catalog entry, so declaring them early is dead configuration.
catalog:
  typescript: ^5.9.0
  drizzle-orm: ^0.44.2
  drizzle-kit: ^0.31.4
  postgres: ^3.4.5
  "@types/node": ^24.10.1
  zod: ^4.1.0
  vitest: ^3.2.0
  fast-check: ^4.0.0
  express: ^4.21.2
  "@types/express": ^4.17.21
  supertest: ^7.0.0
  "@types/supertest": ^6.0.0
  helmet: ^8.0.0
  cors: ^2.8.5
  "@types/cors": ^2.8.17
  pino: ^9.9.0
  "@sentry/node": ^9.0.0
  tsdown: ^0.15.0
  "@supabase/supabase-js": ^2.58.0

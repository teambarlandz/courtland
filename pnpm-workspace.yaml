packages:
  - apps/*
  - packages/*

# The version catalog (docs/02 § 9.1 lists the full target set). Entries are
# added in the phase that first references them — knip fails on an unused
# catalog entry, so declaring them early is dead configuration.
catalog:
  typescript: ^5.9.0
  drizzle-orm: ^0.44.2
  drizzle-kit: ^0.31.4
  postgres: ^3.4.5
  "@types/node": ^24.10.1
